<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Revivana Recovery Center</title>
  <meta name="description" content="Register for your private Revivana Recovery Center wellness portal.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="auth-top-corner-controls">
    <button type="button" class="icon-toggle-btn" data-rtl-toggle aria-label="Toggle text direction"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4L4 8l4 4"/><path d="M4 8h16"/><path d="M16 20l4-4-4-4"/><path d="M20 16H4"/></svg></button>
    <button type="button" class="icon-toggle-btn" data-theme-toggle aria-label="Toggle color theme"></button>
  </div>

  <main class="auth-page">
    <div class="auth-card auth-card-wide" data-animate="scale-in">
      <div class="auth-brand-center">
        <a href="index.html" class="auth-brand-row" aria-label="Revivana Recovery Center">
          <img src="assets/favicon.svg" alt="Revivana Recovery Center Logo" class="brand-logo-img">
          <span class="brand-text-group">
            <span class="brand-name">Revivana</span>
            <span class="brand-tagline">Recovery Center</span>
          </span>
        </a>
        <h1 style="font-size:1.85rem; margin-top:0.75rem;">Create Account</h1>
        <p style="font-size:0.9rem;">Begin your private portal registration.</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-field">
          <label for="su-fname" class="form-label">First Name *</label>
          <input id="su-fname" type="text" class="form-input" placeholder="First name" required>
          <span id="err-su-fname" class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="su-lname" class="form-label">Last Name *</label>
          <input id="su-lname" type="text" class="form-input" placeholder="Last name" required>
          <span id="err-su-lname" class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="su-email" class="form-label">Email Address *</label>
          <input id="su-email" type="email" class="form-input" placeholder="you@example.com" required>
          <span id="err-su-email" class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="su-phone" class="form-label">Phone Number *</label>
          <input id="su-phone" type="tel" class="form-input" placeholder="+1 (555) 000-0000" required>
          <span id="err-su-phone" class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="su-password" class="form-label">Password *</label>
          <div class="password-wrap">
            <input id="su-password" type="password" class="form-input" placeholder="Min. 8 characters" required>
            <button type="button" class="password-eye-btn" data-password-toggle="su-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="err-su-password" class="form-error"></span>
        </div>

        <div class="form-field">
          <label for="su-confirm" class="form-label">Confirm Password *</label>
          <div class="password-wrap">
            <input id="su-confirm" type="password" class="form-input" placeholder="Re-enter password" required>
            <button type="button" class="password-eye-btn" data-password-toggle="su-confirm" aria-label="Show confirm password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="err-su-confirm" class="form-error"></span>
        </div>

        <div class="form-field">
          <label style="display:flex; align-items:flex-start; gap:0.6rem; font-size:0.86rem; color:var(--text-secondary); cursor:pointer;">
            <input id="su-terms" type="checkbox" style="margin-top:0.25rem; accent-color:var(--accent-forest);">
            <span>I agree to the Terms of Service and Privacy Policy (Demo Template).</span>
          </label>
          <span id="err-su-terms" class="form-error"></span>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
        <div id="signup-status" class="form-status-banner" role="status" aria-live="polite"></div>
      </form>

      <div class="auth-divider">Or continue with</div>

      <div class="social-auth-row">
        <button type="button" class="social-auth-icon google" data-social-demo="Google" data-social-target="signup-status" aria-label="Sign up with Google">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5c-.2 1.2-1 2.3-2 3v2.5h3.2c1.9-1.7 3.1-4.3 3.1-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.7-2.5l-3.2-2.5c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.9v2.6C4.6 19.7 8 22 12 22z" fill="#34A853"/><path d="M6.2 13.7c-.2-.6-.3-1.1-.3-1.7s.1-1.2.3-1.7V7.7H2.9C2.3 9 2 10.5 2 12s.3 3 .9 4.3l3.3-2.6z" fill="#FBBC05"/><path d="M12 5.9c1.5 0 2.8.5 3.9 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8 2 4.6 4.3 2.9 7.7l3.3 2.6C7 7.7 9.3 5.9 12 5.9z" fill="#EA4335"/></svg>
        </button>
        <button type="button" class="social-auth-icon facebook" data-social-demo="Facebook" data-social-target="signup-status" aria-label="Sign up with Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </button>
        <button type="button" class="social-auth-icon apple" data-social-demo="Apple" data-social-target="signup-status" aria-label="Sign up with Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.36 1.64c0 1.14-.47 2.22-1.24 2.99-.79.8-2.08 1.41-3.17 1.32-.14-1.1.4-2.25 1.18-3.01.81-.8 2.15-1.39 3.23-1.3zM20.5 17.1c-.49 1.1-.72 1.59-1.35 2.57-.88 1.36-2.12 3.06-3.66 3.07-1.37.01-1.72-.89-3.57-.88-1.85.01-2.24.9-3.61.89-1.54-.02-2.71-1.54-3.59-2.9-2.46-3.79-2.72-8.24-1.2-10.61 1.07-1.67 2.77-2.65 4.36-2.65 1.62 0 2.64.9 3.98.9 1.3 0 2.09-.9 3.96-.9 1.42 0 2.93.77 3.99 2.11-3.51 1.92-2.94 6.92.69 8.4z"/></svg>
        </button>
      </div>

      <p style="text-align:center; font-size:0.88rem; margin-top:1.5rem;">
        Already have an account? <a href="login.html" class="text-forest" style="font-weight:600;">Back to Login</a>
      </p>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
